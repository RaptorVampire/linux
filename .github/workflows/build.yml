name: Build Linux Kernel

on:
  workflow_dispatch:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential \
            libncurses-dev bison flex libssl-dev libelf-dev \
            bc dwarves rsync cpio kmod

      - name: Configure kernel
        run: |
          make defconfig

      - name: Compile kernel
        id: compile
        continue-on-error: true
        run: |
          set -o pipefail
          make -j$(nproc) 2>&1 | tee build.log

      - name: Commit and force push build log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p build-logs
          if [ -f build.log ]; then
            cp build.log build-logs/build.log
          else
            echo "build.log not found" > build-logs/build.log
          fi

          git add -f build-logs/build.log
          git commit -m "build log [skip ci] $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || echo "nothing to commit"
          git push --force origin HEAD:${GITHUB_REF_NAME}

      - name: Fail job if compilation failed
        if: steps.compile.outcome == 'failure'
        run: exit 1

      - name: Upload kernel image
        if: steps.compile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: linux-kernel-image
          path: |
            arch/x86/boot/bzImage
            vmlinux
          retention-days: 7